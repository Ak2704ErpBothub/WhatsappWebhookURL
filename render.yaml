services:
  - type: web
    name: webhook
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: VERIFY_TOKEN
        sync: false
      - key: API_KEY
        sync: false
      - key: APP_SECRET
        sync: false
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: LOG_LEVEL
        value: info
    disk:
      name: webhook-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
